name: Deploy to Production (AWS EC2)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies & test
        working-directory: ./backend
        run: |
          npm ci
          npm run prisma:generate
          npm run typecheck
          npm test

      - name: Install frontend dependencies & lint
        working-directory: ./frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint

  deploy:
    name: Deploy to AWS EC2
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: SSH to EC2 & Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            echo "🚀 [Deploy] Starting Production Deployment..."
            cd /opt/english-center

            echo "📥 [Deploy] Pulling latest changes from branch prod..."
            git fetch origin prod
            git reset --hard origin/prod

            echo "🐳 [Deploy] Building & restarting Docker containers..."
            DOCKER_BUILDKIT=1 docker compose -f compose.yaml -f compose.production.yaml up -d --build --remove-orphans

            echo "⏳ [Deploy] Waiting for backend container to be healthy..."
            for i in $(seq 1 18); do
              if docker compose -f compose.yaml -f compose.production.yaml ps backend | grep -q "healthy"; then
                echo "✅ Backend container is healthy!"
                break
              fi
              echo "Waiting for backend health check ($i/18)..."
              sleep 5
            done

            echo "🌱 [Deploy] Verifying Database Seeding (Admin, Teachers, Courses, Materials)..."
            docker compose -f compose.yaml -f compose.production.yaml exec -T backend node prisma/seed.js

            echo "🧹 [Deploy] Cleaning up unused Docker images..."
            docker image prune -f

            echo "🎉 [Deploy] Production deployment to https://officestaging.id.vn completed successfully!"
